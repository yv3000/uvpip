name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  COVERAGE_THRESHOLD: 90

jobs:
  lint:
    name: Lint & Static Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Install golangci-lint v2.14.0 and Gitleaks v8.30.1
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Typecheck (go vet)
        run: go vet ./...

      - name: Dependency freshness check (go list -m -u)
        run: go list -m -u all

      - name: Run linter (golangci-lint)
        run: golangci-lint run ./...

      - name: Lint workflows (actionlint)
        run: go tool actionlint .github/workflows/ci.yml .github/workflows/release.yml

      - name: Install checksum-pinned ShellCheck 0.11.0
        run: |
          asset=shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$asset"
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Lint shell scripts (shellcheck)
        run: shellcheck installer/*.sh uninstaller/*.sh scripts/*.sh bin/*.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Secret scan (gitleaks)
        run: gitleaks dir --redact --no-banner .

      - name: Verify Python lockfile and packaging
        run: |
          test -f uv.lock || { echo "Missing uv.lock"; exit 1; }
          python3 -m pip install --dry-run --no-build-isolation .

      - name: Python dependency vulnerability audit (pip-audit)
        run: |
          python3 -m pip install --break-system-packages pip-audit==2.7.3
          python3 -m pip_audit .

      - name: Python package tests and coverage gate
        run: |
          python3 -m pip install --break-system-packages coverage==7.6.10
          PYTHONPATH=src coverage run --source=uvpip -m unittest discover -s tests
          coverage report -m --fail-under=90

  test:
    name: Test (${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: macos-14
            race: -race
          # The Windows race detector needs a cgo toolchain; Linux/macOS cover races.
          - os: windows-2022
            race: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Verify zero runtime deps
        run: |
          deps=$(go list -deps -f '{{if and (not .Standard) (not .Module.Main)}}{{.ImportPath}}{{end}}' ./...)
          non_stdlib=$(printf '%s\n' "$deps" | sed '/^$/d')
          if [ -n "$non_stdlib" ]; then
            echo "Unexpected non-stdlib runtime dependency detected:"
            echo "$non_stdlib"
            exit 1
          fi
          echo "Verified: 0 third-party runtime dependencies."

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf 'Run gofmt on:\n%s\n' "$unformatted"; exit 1; fi

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Verify module checksums (go mod verify)
        run: go mod verify

      - name: Typecheck (go vet)
        run: go vet ./...

      - name: Build (go build)
        run: go build -o "$RUNNER_TEMP/uvpip-build" ./...

      - name: Run tests (go test with coverage)
        run: go test -count=1 ${{ matrix.race }} -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage report
        run: |
          go tool cover -func=coverage.out > coverage.txt
          cat coverage.txt

      - name: Upload coverage profile and summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce coverage threshold
        env:
          COVERAGE_THRESHOLD: 90
        run: |
          sh scripts/check-coverage.sh coverage.txt "$COVERAGE_THRESHOLD"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            total=$(awk '$1 == "total:" { sub("%", "", $3); print $3 }' coverage.txt)
            printf '### Coverage Summary\n- Total Statement Coverage: **%s%%**\n' "$total" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify README coverage badge matches statement coverage
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sh scripts/update-coverage-badge.sh coverage.txt README.md
          git diff --exit-code README.md || {
            echo "README.md coverage badge is stale; run scripts/update-coverage-badge.sh"
            exit 1
          }

      - name: Go vulnerability audit (govulncheck)
        run: go tool govulncheck ./...

      - name: Fuzz testing smoke test
        if: runner.os == 'Linux'
        # Full tests already ran above. Count-based campaigns avoid a short fuzz deadline;
        # the job timeout still bounds hangs, and two workers limit runner contention.
        run: |
          go test -run '^$' -fuzz=FuzzTranslateToUV -fuzztime=50000x -parallel=2 ./...
          go test -run '^$' -fuzz=FuzzValidateUVOverride -fuzztime=50000x -parallel=2 ./...
          go test -run '^$' -fuzz=FuzzBuildEnv -fuzztime=50000x -parallel=2 ./...
          go test -run '^$' -fuzz=FuzzValidateArgBounds -fuzztime=50000x -parallel=2 ./...

      - name: Installer tests (POSIX sh, offline)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/uvpip-tests" "$RUNNER_TEMP/uvpip-cache"
          sh scripts/test-installers.sh "$RUNNER_TEMP/uvpip-tests" "$RUNNER_TEMP/uvpip-cache"

      - name: Installer tests (Windows PowerShell 5.1, offline)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'uvpip-tests')
          $cache = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'uvpip-cache')
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-installers.ps1 -TestRoot $tests.FullName -CacheRoot $cache.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer tests failed' }

