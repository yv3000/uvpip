name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: -race
          - os: macos-14
            race: -race
          # The Windows race detector needs a cgo toolchain; Linux/macOS cover races.
          - os: windows-2022
            race: ''
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Check formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf 'Run gofmt on:\n%s\n' "$unformatted"; exit 1; fi

      - name: Verify go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Verify module checksums (go mod verify)
        run: go mod verify

      - name: Typecheck and vet (go vet)
        run: go vet ./...

      - name: Build (go build)
        run: go build -o "$RUNNER_TEMP/uvpip-build" ./...

      - name: Test (go test with coverage)
        run: go test -count=1 ${{ matrix.race }} -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Enforce 90% coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { sub("%", "", $3); print $3 }')
          echo "Total statement coverage: ${total}%"
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            printf '### Coverage Summary\n- Total Statement Coverage: **%s%%**\n' "$total" >> "$GITHUB_STEP_SUMMARY"
          fi
          awk -v total="$total" 'BEGIN { if (total == "" || total + 0 < 90) { print "Coverage below 90%"; exit 1 } }'

      - name: Go vulnerability audit (govulncheck)
        run: go tool govulncheck ./...

      - name: Fuzz testing smoke test
        if: runner.os == 'Linux'
        run: |
          go test -fuzz=FuzzTranslateToUV -fuzztime=2s ./...
          go test -fuzz=FuzzValidateUVOverride -fuzztime=2s ./...
          go test -fuzz=FuzzBuildEnv -fuzztime=2s ./...

      - name: Installer tests (POSIX sh, offline)
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/uvpip-tests" "$RUNNER_TEMP/uvpip-cache"
          sh scripts/test-installers.sh "$RUNNER_TEMP/uvpip-tests" "$RUNNER_TEMP/uvpip-cache"

      - name: Installer tests (Windows PowerShell 5.1, offline)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'uvpip-tests')
          $cache = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'uvpip-cache')
          & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-installers.ps1 -TestRoot $tests.FullName -CacheRoot $cache.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer tests failed' }

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Install golangci-lint v2.14.0 and Gitleaks v8.30.1
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint Go (golangci-lint, config in .golangci.yml)
        run: golangci-lint run ./...

      - name: Lint workflows (actionlint)
        run: go tool actionlint .github/workflows/ci.yml

      - name: Install checksum-pinned ShellCheck 0.11.0
        run: |
          asset=shellcheck-v0.11.0.linux.x86_64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/$asset" "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/$asset"
          echo "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.11.0" >> "$GITHUB_PATH"

      - name: Lint shell scripts (shellcheck)
        run: shellcheck installer/*.sh uninstaller/*.sh scripts/*.sh bin/*.sh

      - name: Parse PowerShell scripts
        shell: pwsh
        run: ./scripts/check-powershell.ps1

      - name: Secret scan (gitleaks)
        run: gitleaks dir --redact --no-banner .
