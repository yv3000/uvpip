name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: go.sum

      - name: Build cross-platform release binaries
        run: |
          mkdir -p dist
          targets=(
            "linux/amd64/uvpip-linux-amd64"
            "linux/arm64/uvpip-linux-arm64"
            "darwin/amd64/uvpip-darwin-amd64"
            "darwin/arm64/uvpip-darwin-arm64"
            "windows/amd64/uvpip-windows-amd64.exe"
            "windows/arm64/uvpip-windows-arm64.exe"
          )
          for target in "${targets[@]}"; do
            IFS="/" read -r os arch out <<< "$target"
            echo "Building $out ($os/$arch)..."
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/$out" ./...
          done

      - name: Build Python distribution (wheel & sdist)
        run: |
          python3 -m pip install --break-system-packages --upgrade build twine
          python3 -m build --outdir dist/

      - name: Generate SHA-256 Checksums
        working-directory: dist
        run: |
          sha256sum uvpip-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release create "$tag" dist/* --title "uvpip $tag" --generate-notes

      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -n "${PYPI_API_TOKEN:-}" ]; then
            python3 -m twine upload --skip-existing -u __token__ -p "$PYPI_API_TOKEN" dist/*.whl dist/*.tar.gz
          else
            echo "PYPI_API_TOKEN secret not configured; skipping PyPI upload."
          fi
